<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMC Courses — Espace de formation</title>

<style>
:root {
  --blue: #234e97;
  --dark: #192b57;
  --text: #23334c;
  --muted: #708097;
  --line: #dce4f2;
  --bg: #f0f3fa;
  --shadow: 0 10px 28px rgba(25,50,95,.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at top left, #e0e7f7, transparent 55%),
    var(--bg);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: var(--blue); }

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #7da7ec;
  outline-offset: 3px;
}

button:disabled { opacity: .55; cursor: wait; }

input, select, textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--text);
}

textarea { min-height: 110px; resize: vertical; }

label {
  display: block;
  margin: 14px 0 7px;
  font-size: 14px;
}

.primary, .secondary, .danger {
  border: 0;
  border-radius: 10px;
  padding: 11px 16px;
}

.primary { background: var(--blue); color: white; }
.secondary { background: #dfe8f8; color: var(--blue); }
.danger { background: #fce5e8; color: #ae243a; }
.small { font-size: 12px; }
.muted { color: var(--muted); line-height: 1.65; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 18px;
}

/* ROLE SELECTION */

.entry-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background:
    radial-gradient(circle at 15% 15%, #384b82, transparent 45%),
    linear-gradient(130deg, #172243, #253c70);
}

.entry-wrap { width: min(100%, 1000px); }
.entry-heading { color: white; text-align: center; margin-bottom: 30px; }
.entry-heading h1 { font-size: 38px; margin: 10px 0; }
.entry-heading p { opacity: .8; }

.entry-language {
  display: block;
  width: 150px;
  margin: 0 auto 20px;
}

.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.role-card {
  overflow: hidden;
  padding: 0;
  text-align: start;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 24px;
  background: white;
  color: var(--text);
  box-shadow: 0 20px 50px rgba(0,0,0,.18);
  transition: transform .2s;
}

.role-card:hover { transform: translateY(-5px); }

.role-art {
  width: 100%;
  height: 220px;
  display: block;
  background: linear-gradient(135deg, #e8efff, #b9d2ff);
}

.role-card.teacher .role-art {
  background: linear-gradient(135deg, #efeaff, #c9c0ef);
}

.role-copy { padding: 25px; }
.role-copy h2 { margin: 0 0 10px; font-size: 25px; }
.role-copy p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
.role-go { display: inline-block; color: var(--blue); font-weight: 650; }

.entry-note {
  text-align: center;
  color: #c6d2ec;
  font-size: 12px;
  margin-top: 24px;
  line-height: 1.7;
}

/* LOGIN */

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(130deg, #172243, #253c70);
}

.login-box {
  width: min(100%, 440px);
  padding: 32px;
  border-radius: 22px;
  background: white;
  box-shadow: 0 20px 60px #0003;
}

.login-brand {
  margin: 22px 0 0;
  color: var(--blue);
  font-size: 26px;
  font-weight: 750;
}

.login-box h1 { margin: 14px 0 8px; font-size: 23px; color: var(--text); }
.login-box .primary { width: 100%; margin-top: 22px; }

.role-badge {
  display: inline-block;
  margin-top: 18px;
  padding: 6px 11px;
  border-radius: 20px;
  background: #e8eefb;
  color: var(--blue);
  font-size: 12px;
}

/* HEADER */

#app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.site-header {
  flex-shrink: 0;
  background: var(--dark);
  color: white;
  z-index: 40;
}

.header-inner {
  max-width: 1700px;
  margin: auto;
  padding: 13px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  direction: ltr;
}

.brand {
  background: none;
  border: 0;
  color: white;
  text-align: start;
  padding: 0;
}

.brand-title { display: block; font-size: 22px; font-weight: 750; }
.brand-subtitle { font-size: 11px; opacity: .75; }

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  direction: ltr;
}

.header-controls select { width: 112px; padding: 9px; border: 0; }

.account-wrap { position: relative; }

.account-button {
  width: 42px;
  height: 42px;
  padding: 0;
  border: 2px solid #ffffff80;
  border-radius: 50%;
  overflow: hidden;
  color: white;
  background: #4f6aa1;
}

.account-button .avatar {
  width: 100%;
  height: 100%;
  margin: 0;
  box-shadow: none;
}

.account-menu {
  position: absolute;
  right: 0;
  top: 54px;
  width: min(320px, 88vw);
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #f9fbff;
  color: var(--text);
  box-shadow: 0 20px 45px #10234438;
  direction: ltr;
}

html[dir="rtl"] .account-menu { direction: rtl; }

.account-summary {
  text-align: center;
  padding: 4px 0 15px;
  overflow-wrap: anywhere;
}

.account-summary .avatar { width: 65px; height: 65px; }
.account-summary h3 { margin: 8px 0 5px; }
.account-summary p { margin: 4px 0; font-size: 12px; color: var(--muted); }

.menu-item {
  width: 100%;
  display: block;
  text-align: start;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text);
}

.menu-item:hover { background: #e5edfb; }
.menu-item.logout { color: #b12840; }

.hamburger {
  display: none;
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 9px;
  background: #ffffff18;
  color: white;
  font-size: 26px;
  flex-shrink: 0;
}

/* DASHBOARD */

.dashboard {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1700px;
  margin: auto;
  display: grid;
  grid-template-columns: 170px minmax(0,1fr) 305px;
  gap: 22px;
  padding: 22px;
  direction: ltr;
}

/* Channel view: remove the left column completely. */
.dashboard.channel-layout {
  grid-template-columns: minmax(0,1fr) 305px;
}

.dashboard > * {
  min-height: 0;
  min-width: 0;
  direction: ltr;
}

html[dir="rtl"] .dashboard > * { direction: rtl; }

.people-panel, .workspace, .poles-panel {
  height: 100%;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scrollbar-width: thin;
  scrollbar-color: #b5c4dd transparent;
}

.people-panel, .poles-panel { padding: 10px 5px 24px; }

.panel-heading {
  margin: 0 0 20px;
  color: var(--blue);
  font-size: 15px;
}

.people-panel .panel-heading { text-align: center; }

.people-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 4px;
}

.person-card {
  width: 100%;
  padding: 8px 4px;
  border: 1px solid transparent;
  border-radius: 15px;
  background: transparent;
  color: inherit;
  text-align: center;
}

button.person-card:hover { background: #ffffff80; }
.person-card.active { background: #dce7fa; border-color: #bfd1ef; }

.avatar {
  width: 88px;
  height: 88px;
  margin: 0 auto 11px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  background: linear-gradient(145deg, #dce5f5, #bdcce6);
  box-shadow: 0 6px 18px #1e37641f;
  flex-shrink: 0;
}

.avatar svg { width: 56%; height: 56%; fill: #8195b5; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.person-name {
  display: block;
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 5px;
  overflow-wrap: anywhere;
}

.person-role {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.workspace {
  padding: 2px 5px 25px;
  scroll-margin-top: 95px;
}

/* ANNOUNCEMENTS */

.hero {
  min-height: 340px;
  padding: 34px;
  border-radius: 22px;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  background:
    radial-gradient(circle at 90% 10%, #6177b4, transparent 45%),
    linear-gradient(135deg, #29274e, #144d90);
  box-shadow: var(--shadow);
}

.hero h2 { font-size: clamp(25px,3vw,39px); margin: 18px 0 12px; }
.hero p { line-height: 1.8; margin: 0; }

.tag {
  padding: 6px 11px;
  border-radius: 20px;
  background: #ffffff22;
  font-size: 12px;
}

.announcement-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 20px;
}

.announcement-card {
  padding: 24px;
  background: #ffffffc9;
  border-radius: 18px;
  box-shadow: var(--shadow);
}

.announcement-card h3 { margin: 0 0 12px; color: var(--blue); }
.announcement-card p { margin: 0; color: var(--muted); line-height: 1.7; }

/* BIGGER POLE BUTTONS */

.poles-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.poles-heading h2 { margin: 0; font-size: 17px; }
.pole-item + .pole-item { margin-top: 14px; }

.pole-button {
  width: 100%;
  min-height: 84px;
  padding: 19px 16px;
  border: 0;
  border-radius: 16px;
  color: var(--blue);
  background: #e0e7f4;
  text-align: start;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.45;
}

.pole-button:hover { background: #d7e3f6; }
.pole-button[aria-expanded="true"] { background: #d0dff6; }

.pole-symbol {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 43px;
  height: 43px;
  border-radius: 12px;
  background: #ffffff70;
  font-size: 23px;
}

.pole-label { flex: 1; }
.pole-arrow { flex-shrink: 0; font-size: 20px; }

.pole-content { padding: 10px 3px 2px; }
.year-group + .year-group { margin-top: 8px; }

.year-button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  color: var(--blue);
  background: #e4ebf8;
  text-align: start;
  font-size: 14px;
}

.year-button[aria-expanded="true"] { background: #c7d9f4; }

.branch-list {
  display: grid;
  gap: 7px;
  padding: 8px 0;
  padding-inline-start: 9px;
}

.branch-button {
  width: 100%;
  padding: 11px;
  border: 1px solid #d5dfef;
  border-radius: 9px;
  color: var(--text);
  background: #ffffff80;
  text-align: start;
  font-size: 12px;
  line-height: 1.5;
}

.branch-button.selected { background: var(--blue); color: white; }

.close-menu {
  display: none;
  border: 0;
  background: #e1e9f7;
  border-radius: 9px;
  width: 40px;
  height: 40px;
  font-size: 25px;
}

/* MODULES AND CHANNELS */

.view-heading { margin: 20px 0 9px; color: var(--blue); line-height: 1.4; }

.breadcrumb {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 22px;
}

.modules-grid, .resource-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(175px,1fr));
  gap: 15px;
}

.module-card {
  min-height: 140px;
  padding: 23px 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #ffffffcc;
  color: var(--blue);
  box-shadow: var(--shadow);
  line-height: 1.6;
}

.module-card:hover { background: #e5efff; }
.module-icon { display: block; font-size: 27px; margin-bottom: 12px; }

.channel-banner {
  height: 180px;
  margin-top: 16px;
  border-radius: 20px;
  overflow: hidden;
  background:
    radial-gradient(circle at 80% 20%, #6a83bd, transparent 40%),
    linear-gradient(120deg, #25294e, #225399);
}

.channel-banner img { width: 100%; height: 100%; object-fit: cover; }

.channel-info {
  display: flex;
  gap: 22px;
  padding: 26px 4px;
  align-items: flex-start;
}

.channel-avatar { width: 120px; height: 120px; margin: 0; }
.channel-details { flex: 1; min-width: 0; }
.channel-details h2 { margin: 0 0 8px; color: var(--blue); font-size: 28px; }
.channel-details .muted { margin: 8px 0; font-size: 14px; }

.channel-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  font-size: 13px;
  margin: 13px 0;
}

.bio { white-space: pre-line; }

.follow-button {
  border: 0;
  border-radius: 24px;
  padding: 10px 20px;
  background: var(--blue);
  color: white;
}

.follow-button.following { background: #dbe6f8; color: var(--blue); }

.channel-tabs {
  display: flex;
  border-bottom: 1px solid #cfdaeb;
  gap: 6px;
  margin-bottom: 20px;
}

.channel-tab {
  flex: 1;
  padding: 14px 8px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--muted);
  font-weight: 650;
}

.channel-tab[aria-selected="true"] {
  color: var(--blue);
  border-bottom-color: var(--blue);
}

.resource-card {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #ffffffc9;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}

.resource-card h3 { font-size: 15px; line-height: 1.5; margin: 12px 0 9px; }
.resource-card a { display: block; text-decoration: none; }
.resource-card .actions { margin-top: 14px; }
.resource-card button { padding: 7px 10px; font-size: 12px; }
.resource-icon { font-size: 28px; }

.empty-state {
  padding: 32px 20px;
  border: 1px dashed #bacbe4;
  border-radius: 15px;
  text-align: center;
  color: var(--muted);
  line-height: 1.7;
}

.owner-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 0 0 18px;
  padding: 15px;
  border-radius: 13px;
  background: #dfe9fb;
}

/* DIALOGS */

dialog {
  width: min(580px,94vw);
  max-height: 90vh;
  border: 0;
  border-radius: 20px;
  padding: 25px;
  background: #f9fbff;
  color: var(--text);
  box-shadow: 0 25px 80px #0004;
}

dialog::backdrop { background: #0e1e3e99; }
dialog h2 { margin: 0 0 10px; color: var(--blue); }

.dialog-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.dialog-close {
  border: 0;
  background: #e5edfb;
  border-radius: 8px;
  width: 35px;
  height: 35px;
  font-size: 23px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

dialog select[multiple] { min-height: 150px; }
.dialog-note { font-size: 12px; color: var(--muted); line-height: 1.6; }

.status {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  max-width: 90vw;
  padding: 13px 20px;
  border-radius: 12px;
  background: #172e56;
  color: white;
  box-shadow: var(--shadow);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: #0c162d80;
}

body.menu-open { overflow: hidden; }

/* RESPONSIVE */

@media (min-width:901px) and (max-width:1150px) {
  .dashboard {
    grid-template-columns: 140px minmax(0,1fr) 270px;
    gap: 14px;
    padding: 17px;
  }

  .dashboard.channel-layout {
    grid-template-columns: minmax(0,1fr) 270px;
  }

  .avatar { width: 76px; height: 76px; }
  .channel-avatar { width: 110px; height: 110px; }
  .pole-button { font-size: 15px; }
}

@media (max-width:900px) {
  #app { height: auto; min-height: 100vh; overflow: visible; }
  .site-header { position: sticky; top: 0; }
  .header-inner { padding: 12px 15px; }
  .brand-title { font-size: 19px; }
  .brand-subtitle { display: none; }
  .hamburger { display: block; }

  .dashboard,
  .dashboard.channel-layout {
    grid-template-columns: minmax(0,1fr);
    padding: 15px;
    gap: 16px;
  }

  .people-panel { height: auto; overflow: visible; padding: 5px 0; }
  .people-panel .panel-heading { text-align: start; margin-bottom: 10px; }

  .people-list {
    flex-direction: row;
    overflow-x: auto;
    gap: 12px;
    padding: 4px 4px 14px;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
  }

  .person-card { flex: 0 0 125px; scroll-snap-align: start; }
  .avatar { width: 74px; height: 74px; }
  .workspace { height: auto; overflow: visible; padding: 0 0 20px; }
  .hero { min-height: 280px; padding: 26px; }

  .poles-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    width: min(355px,90vw);
    height: 100%;
    padding: 20px;
    overflow-y: auto;
    border-radius: 20px 0 0 20px;
    background: #f0f4fc;
    box-shadow: -15px 0 45px #0f23462e;
    transform: translateX(105%);
    visibility: hidden;
    transition: transform .25s,visibility .25s;
  }

  .poles-panel.open { transform: translateX(0); visibility: visible; }
  .close-menu { display: block; }
  .channel-avatar { width: 95px; height: 95px; }
}

@media (max-width:550px) {
  .role-grid { grid-template-columns: 1fr; }
  .role-art { height: 175px; }
  .entry-heading h1 { font-size: 30px; }
  .header-inner { flex-wrap: wrap; }
  .header-controls { margin-left: auto; }
  .header-controls select { width: 98px; font-size: 12px; }
  .announcement-grid { grid-template-columns: 1fr; }
  .channel-info { flex-direction: column; }
  .channel-banner { height: 125px; }
  .form-row { grid-template-columns: 1fr; gap: 0; }
}

@media (prefers-reduced-motion:reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<body>

<!-- ROLE SELECTION -->
<section class="entry-page" id="entryPage">
  <div class="entry-wrap">
    <select class="entry-language language-control" aria-label="Langue">
      <option value="fr">Français</option>
      <option value="ar">العربية</option>
      <option value="en">English</option>
    </select>

    <div class="entry-heading">
      <h1>CMC Courses</h1>
      <p data-i18n="chooseSpace"></p>
    </div>

    <div class="role-grid">
      <button class="role-card" type="button" onclick="chooseRole('student')">
        <svg class="role-art" viewBox="0 0 440 230"
          role="img" aria-label="Illustration stagiaires">
          <circle cx="330" cy="65" r="45" fill="#ffffff55"/>
          <rect x="55" y="45" width="140" height="135" rx="15" fill="#fff"/>
          <path d="M77 80h95M77 100h75M77 120h90"
            stroke="#9eb9e8" stroke-width="8"/>
          <circle cx="285" cy="90" r="32" fill="#e8b894"/>
          <path d="M251 84q0-48 38-37 35 8 27 44l-17-19-48 12"
            fill="#263d69"/>
          <path d="M220 215v-42q0-47 65-47t65 47v42" fill="#345eaa"/>
          <path d="M232 159l53 25 53-25v50H232z" fill="#fff"/>
          <path d="M285 184v25" stroke="#b9ccec" stroke-width="3"/>
        </svg>
        <div class="role-copy">
          <h2 data-i18n="student"></h2>
          <p data-i18n="studentDescription"></p>
          <span class="role-go" data-i18n="enterSpace"></span>
        </div>
      </button>

      <button class="role-card teacher" type="button"
        onclick="chooseRole('teacher')">
        <svg class="role-art" viewBox="0 0 440 230"
          role="img" aria-label="Illustration formateurs">
          <rect x="180" y="35" width="205" height="125" rx="13" fill="#fff"/>
          <path d="M205 65h130M205 88h95M205 112h115"
            stroke="#b4a9dd" stroke-width="8"/>
          <circle cx="125" cy="86" r="31" fill="#e8b894"/>
          <path d="M93 83q-3-48 34-37 34 7 27 43l-20-18-41 12"
            fill="#39345c"/>
          <path d="M65 215v-44q0-47 60-47t60 47v44" fill="#6961a2"/>
          <path d="M172 143l66-47" stroke="#e8b894"
            stroke-width="15" stroke-linecap="round"/>
          <path d="M122 126l-13 22 16 50 15-50-13-22" fill="#fff"/>
        </svg>
        <div class="role-copy">

/* COURSE DATA */

function modules(text) {
  return text.split(";").map(item => item.trim()).filter(Boolean);
}

function branch(fr, ar, en, list) {
  return { name: { fr, ar, en }, modules: modules(list) };
}

const commonTS = modules(
  "Français; Anglais technique; Culture entrepreneuriale; Compétences comportementales; Entrepreneuriat - PIE 2; Culture et techniques avancées du numérique"
);

function tsBranch(fr, ar, en, list) {
  return {
    name: { fr, ar, en },
    modules: [...commonTS, ...modules(list)]
  };
}

/* LOCAL DATABASE
   Keep the same database name to preserve previous demo profiles.
   No passwords or authentication tokens are stored.
*/
let databasePromise;

function openDatabase() {
  if (!databasePromise) {
    databasePromise = new Promise((resolve,reject) => {
      const request = indexedDB.open("cmc-channel-prototype-v1",1);

      request.onupgradeneeded = () => {
        request.result.createObjectStore("teachers",{keyPath:"id"});
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error("Database blocked"));
    });
  }
  return databasePromise;
}

async function loadTeachers() {
  const database = await openDatabase();

  return new Promise((resolve,reject) => {
    const request = database
      .transaction("teachers","readonly")
      .objectStore("teachers")
      .getAll();

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function persistTeacher(teacher) {
  const database = await openDatabase();

  return new Promise((resolve,reject) => {
    const transaction = database.transaction("teachers","readwrite");
    transaction.objectStore("teachers").put(teacher);

    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

const teachers = new Map();
const phoneQuery = matchMedia("(max-width:900px)");
const objectURLs = new Map();

function blobURL(blob) {
  if (!blob) return "";
  if (!objectURLs.has(blob)) {
    objectURLs.set(blob,URL.createObjectURL(blob));
  }
  return objectURLs.get(blob);
}

function releaseURLs() {
  objectURLs.forEach(url => URL.revokeObjectURL(url));
  objectURLs.clear();
}

function t(key) {
  return translations[language][key] || key;
}

function el(tag,className,value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value !== undefined) node.textContent = value;
  return node;
}

function notify(message) {
  clearTimeout(statusTimer);
  $("status").textContent = message;
  $("status").hidden = false;
  statusTimer = setTimeout(() => $("status").hidden = true,5000);
}

function safeURL(value) {
  try {
    const url = new URL(value);
    return ["http:","https:"].includes(url.protocol) ? url.href : null;
  } catch {
    return null;
  }
}

function teacherName(teacher) {
  return teacher.name ||
    `${t("teacherPlaceholder")} ${teacher.number || ""}`.trim();
}

function ownTeacher() {
  return session?.role === "teacher"
    ? teachers.get(session.teacherId)
    : null;
}

function isOwner() {
  return Boolean(
    ownTeacher() &&
    currentTeacherId === session.teacherId
  );
}

function makeAvatar(blob,name,large=false) {
  const box = el("div","avatar" + (large ? " channel-avatar" : ""));

  function placeholder() {
    box.innerHTML = `
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="21" r="12"></circle>
        <path d="M10 60v-7c0-12 10-20 22-20s22 8 22 20v7z"></path>
      </svg>
    `;
  }

  placeholder();

  if (blob) {
    const image = el("img");
    image.src = blobURL(blob);
    image.alt = name;
    image.onerror = placeholder;
    box.replaceChildren(image);
  }

  return box;
}

const ready = (async () => {
  try {
    const saved = await loadTeachers();

    saved.forEach(teacher => {
      if (
        teacher &&
        typeof teacher.id === "string" &&
        Array.isArray(teacher.resources) &&
        Array.isArray(teacher.branchIds)
      ) {
        teachers.set(teacher.id,teacher);
      }
    });
  } catch {
    /* Browsing works without persistent storage. */
  }
})();

/* LANGUAGE */

function setLanguage(value) {
  language = translations[value] ? value : "fr";

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(node => {
    node.textContent = t(node.dataset.i18n);
  });

  document.querySelectorAll(".language-control").forEach(node => {
    node.value = language;
  });

  $("loginRole").textContent =
    t(selectedRole === "teacher" ? "teacher" : "student");

  $("loginHeading").textContent =
    t(selectedRole === "teacher" ? "teacherAccount" : "studentAccount");

  if (session) {
    $("headerRole").textContent =
      t(session.role === "teacher" ? "teacherAccount" : "studentAccount");

    renderAccount();
    renderPeople();
    buildMenu();

    if (selection) renderModules();

function chooseRole(role) {
  selectedRole = role;
  $("entryPage").hidden = true;
  $("loginPage").hidden = false;

  setLanguage(language);
  $("loginEmail").focus();

function showEntry() {
  $("loginPassword").value = "";
  $("loginPage").hidden = true;
  $("entryPage").hidden = false;
}

$("loginForm").addEventListener("submit",async event => {
  event.preventDefault();
  if (!$("loginForm").reportValidity()) return;

  $("loginSubmit").disabled = true;

  const email = $("loginEmail").value.trim().toLowerCase();
  $("loginPassword").value = "";

  try {
    await ready;

    if (selectedRole === "teacher") {
      const id = "teacher:" + email;

      if (!teachers.has(id)) {
        const profile = {
          id,
          email,
          name:email.split("@")[0],
          specialty:"",
          bio:"",
          branchIds:[],
          resources:[],
          photo:null,
          banner:null,
          placeholder:false
        };

        try {
          await persistTeacher(profile);
        } catch {
          notify(t("storageError"));
        }

        teachers.set(id,profile);
      }

      session = {role:"teacher",email,teacherId:id};
    } else {
      session = {role:"student",email};
    }

    $("loginPage").hidden = true;
    $("app").hidden = false;

    setLanguage(language);
    goHome();
    closeMenu(false);
  } finally {
    $("loginSubmit").disabled = false;
  }
});

function logout() {

  document.querySelectorAll("dialog[open]").forEach(dialog => dialog.close());

  session = null;
  selection = null;
  currentTeacherId = null;
  expandedPole = null;
  expandedYear = null;
  currentView = "home";

  $("app").hidden = true;
  $("entryPage").hidden = false;

}

      list.appendChild(card);

    !teacher.placeholder &&
    teacher.branchIds.includes(selection.program.id)
  );

    ? realTeachers
    : [...teachers.values()].filter(teacher =>
        teacher.placeholder &&
        teacher.branchIds.includes(selection.program.id)

/* POLES AND BRANCHES */

function buildMenu() {
  const container = $("poleMenu");
  const focused = container.contains(document.activeElement)
    ? document.activeElement.id
    : null;

  const scroll = $("poleSidebar").scrollTop;
  container.replaceChildren();

  poles.forEach(pole => {
    const item = el("div","pole-item");
    const button = el("button","pole-button");

    button.type = "button";
    button.id = "pole-button-" + pole.id;

    const content = el("div","pole-content");
    content.id = "pole-content-" + pole.id;

    const open = expandedPole === pole.id;
    content.hidden = !open;

    button.setAttribute("aria-expanded",String(open));
    button.setAttribute("aria-controls",content.id);

    const symbol = el("span","pole-symbol",pole.icon);
    symbol.setAttribute("aria-hidden","true");

    const arrow = el("span","pole-arrow",open ? "−" : "+");
    arrow.setAttribute("aria-hidden","true");

    button.append(
      symbol,
      el("span","pole-label",pole.name[language]),
      arrow
    );

    [1,2].forEach(year => {
      const group = el("div","year-group");
      const yearButton = el("button","year-button");

      yearButton.type = "button";
      yearButton.id = `${pole.id}-year-${year}`;

      const yearOpen = open && expandedYear === year;
      yearButton.textContent = (yearOpen ? "▾ " : "▸ ") + t("year" + year);
      yearButton.setAttribute("aria-expanded",String(yearOpen));

      const list = el("div","branch-list");
      list.id = `${pole.id}-branches-${year}`;
      list.hidden = !yearOpen;

      yearButton.setAttribute("aria-controls",list.id);

      pole.branches[year].forEach(program => {
        const branchButton = el("button","branch-button",program.name[language]);
        branchButton.type = "button";
        branchButton.id = "branch-" + program.id;

        const selected = selection?.program.id === program.id;
        branchButton.classList.toggle("selected",selected);

        if (selected) branchButton.setAttribute("aria-current","true");

        branchButton.onclick = () => {
          expandedPole = pole.id;
          expandedYear = year;
          selectBranch(pole,year,program);

          if (phoneQuery.matches) {
            closeMenu(false);
            revealCenter("modulesTitle");
          }
        };

        list.appendChild(branchButton);
      });

      yearButton.onclick = () => {
        const already = expandedPole === pole.id && expandedYear === year;

        expandedPole = pole.id;
        expandedYear = already ? null : year;

        if (!already && pole.branches[year].length) {
          selectBranch(pole,year,pole.branches[year][0]);
        } else {
          buildMenu();
        }
      };

      group.append(yearButton,list);
      content.appendChild(group);
    });

    button.onclick = () => {
      expandedPole = expandedPole === pole.id ? null : pole.id;
      expandedYear = null;
      buildMenu();
    };

    item.append(button,content);
    container.appendChild(item);
  });

  $("poleSidebar").scrollTop = scroll;

  if (focused) {
    const replacement = $(focused);
    if (replacement?.getClientRects().length) {
      replacement.focus({preventScroll:true});
    }
  }
}

/* LOCAL FOLLOW DEMO */

let followMap = {};

try {
  const stored = JSON.parse(
    localStorage.getItem("cmc-prototype-follows") || "{}"
  );

  if (stored && typeof stored === "object" && !Array.isArray(stored)) {
    followMap = stored;
  }
} catch {}

function followKey() {
  return session ? session.role + ":" + session.email : "";
}

function isFollowing(id) {
  return Array.isArray(followMap[followKey()]) &&
    followMap[followKey()].includes(id);
}

function localFollowerCount(id) {
  return Object.values(followMap).filter(list =>
    Array.isArray(list) && list.includes(id)
  ).length;
}

function toggleFollow() {
  if (!session || !currentTeacherId || isOwner()) return;

  const key = followKey();
  const list = new Set(
    Array.isArray(followMap[key]) ? followMap[key] : []
  );

  if (list.has(currentTeacherId)) list.delete(currentTeacherId);
  else list.add(currentTeacherId);

  followMap[key] = [...list];

  try {
    localStorage.setItem("cmc-prototype-follows",JSON.stringify(followMap));
  } catch {}

  updateCounts();
}

/* CHANNEL DISPLAY */

function openOwnChannel() {
  if (!ownTeacher()) return;

  closeAccount();
  openChannel(session.teacherId);
}

function openChannel(id) {
  if (!teachers.has(id)) return;

  currentTeacherId = id;
  currentTab = "pdfs";

  renderChannel();

  /* This hides the left panel and expands the channel area. */
  showView("channel");

  revealCenter("channelName");
}

function renderChannel() {
  const teacher = teachers.get(currentTeacherId);
  if (!teacher) return;

  const banner = $("channelBanner");
  banner.replaceChildren();

  if (teacher.banner) {
    const image = el("img");
    image.src = blobURL(teacher.banner);
    image.alt = "";
    image.onerror = () => image.remove();
    banner.appendChild(image);
  }

  $("channelAvatar").replaceChildren(
    makeAvatar(teacher.photo,teacherName(teacher),true)
  );

  $("channelName").textContent = teacherName(teacher);

  const branches = teacher.branchIds
    .map(id => branchIndex.get(id)?.program.name[language])
    .filter(Boolean);

  $("channelSpecialty").textContent =
    teacher.specialty || branches.join(" • ");

  $("channelBio").textContent = teacher.bio || t("bioPlaceholder");

  $("ownerTools").hidden = !isOwner();
  $("followButton").hidden = isOwner();

  updateCounts();
  selectTab(currentTab);
}

function updateCounts() {
  const teacher = teachers.get(currentTeacherId);
  if (!teacher) return;

  $("followerCount").textContent =
    localFollowerCount(teacher.id) + " " + t("followers");

  $("videoCount").textContent =
    teacher.resources.filter(resource =>
      resource.kind === "videos"
    ).length + " " + t("videos");

  const following = isFollowing(teacher.id);

  $("followButton").textContent = t(following ? "following" : "follow");
  $("followButton").classList.toggle("following",following);
  $("followButton").setAttribute("aria-pressed",String(following));
}

function selectTab(kind) {
  currentTab = ["pdfs","exercises","videos"].includes(kind)
    ? kind
    : "pdfs";

  ["pdfs","exercises","videos"].forEach(key => {
    const active = key === currentTab;
    const button = $("tab-" + key);

    button.setAttribute("aria-selected",String(active));
    button.tabIndex = active ? 0 : -1;
  });

  const panel = $("resourcePanel");
  panel.setAttribute("aria-labelledby","tab-" + currentTab);
  panel.replaceChildren();

  const teacher = teachers.get(currentTeacherId);
  if (!teacher) return;

  const resources = teacher.resources.filter(resource =>
    currentTab === "exercises"
      ? ["exercises","exams"].includes(resource.kind)
      : resource.kind === currentTab
  );

  if (!resources.length) {
    panel.appendChild(el("div","empty-state",t("empty")));
    return;
  }

  const grid = el("div","resource-grid");

  resources.forEach(resource => {
    const card = el("article","resource-card");

    const icon = resource.kind === "videos" ? "▶"
      : resource.kind === "exams" ? "📝"
      : resource.kind === "exercises" ? "✍"
      : "📄";

    card.append(
      el("span","resource-icon",icon),
      el("h3","",resource.title)
    );

    if (resource.kind === "exams") {
      card.appendChild(el("p","muted small",t("exams")));
    }

    if (resource.description) {
      card.appendChild(el("p","muted small",resource.description));
    }

    const href = resource.file
      ? blobURL(resource.file)
      : safeURL(resource.url);

    if (href) {
      const link = el("a","",t("open") + " ↗");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      card.appendChild(link);
    }

    if (isOwner()) {
      const actions = el("div","actions");

      const edit = el("button","secondary",t("edit"));
      edit.type = "button";
      edit.onclick = () => openResourceEditor(resource.id);

      const remove = el("button","danger",t("delete"));
      remove.type = "button";
      remove.onclick = () => deleteResource(resource.id);

      actions.append(edit,remove);
      card.appendChild(actions);
    }

    grid.appendChild(card);
  });

  panel.appendChild(grid);
}

/* PROFILE EDITOR */

function openProfileEditor() {
  const teacher = ownTeacher();
  if (!teacher) return;

  closeAccount();
  $("profileForm").reset();

  $("profileName").value = teacher.name;
  $("profileSpecialty").value = teacher.specialty;
  $("profileBio").value = teacher.bio;

  const options = $("profileBranches");
  options.replaceChildren();

  branchIndex.forEach(({pole,year,program},id) => {
    const option = el(
      "option","",
      pole.name[language] + " / " +
      t("year" + year) + " / " +
      program.name[language]
    );

    option.value = id;
    option.selected = teacher.branchIds.includes(id);
    options.appendChild(option);
  });

  $("profileDialog").showModal();
}

$("profileForm").addEventListener("submit",async event => {
  event.preventDefault();

  const teacher = ownTeacher();
  if (!teacher) return;

  const photo = $("profilePhoto").files[0];
  const banner = $("profileBanner").files[0];

  for (const image of [photo,banner]) {
    if (!image) continue;

    if (!image.type.startsWith("image/")) {
      notify(t("imageError"));
      return;
    }

    if (image.size > 5 * 1024 * 1024) {
      notify(t("sizeError"));
      return;
    }
  }

  const updated = {
    ...teacher,
    name:$("profileName").value.trim(),
    specialty:$("profileSpecialty").value.trim(),
    bio:$("profileBio").value.trim(),
    branchIds:[...$("profileBranches").selectedOptions]
      .map(option => option.value),
    photo:photo || teacher.photo,
    banner:banner || teacher.banner
  };

  if (!updated.name) return;

  const submit = event.submitter ||
    $("profileForm").querySelector('[type="submit"]');

  submit.disabled = true;

  try {
    await persistTeacher(updated);
    teachers.set(updated.id,updated);

    $("profileDialog").close();

    renderAccount();
    renderPeople();

    if (currentTeacherId === updated.id) renderChannel();

    notify(t("saved"));
  } catch {
    notify(t("storageError"));
  } finally {
    submit.disabled = false;
  }
});

/* RESOURCE EDITOR */

function updateFileAccept() {
  $("resourceFile").accept =
    $("resourceKind").value === "videos"
      ? "video/*"
      : "application/pdf,.pdf";
}

$("resourceKind").addEventListener("change",updateFileAccept);

function openResourceEditor(resourceId=null) {
  const teacher = ownTeacher();
  if (!teacher) return;

  closeAccount();

  const resource = resourceId
    ? teacher.resources.find(item => item.id === resourceId)
    : null;

  if (resourceId && !resource) return;

  editingResourceId = resource?.id || null;
  $("resourceForm").reset();

  if (resource) {
    $("resourceTitle").value = resource.title;
    $("resourceKind").value = resource.kind;
    $("resourceDescription").value = resource.description || "";
    $("resourceURL").value = resource.url || "";
  }

  $("existingFileNote").textContent = resource?.file
    ? t("existingFile") + (resource.fileName || resource.file.name || "")
    : "";

  updateFileAccept();
  $("resourceDialog").showModal();
}

$("resourceForm").addEventListener("submit",async event => {
  event.preventDefault();

  const teacher = ownTeacher();
  if (!teacher) return;

  const old = teacher.resources.find(item =>
    item.id === editingResourceId
  );

  const file = $("resourceFile").files[0];
  const enteredURL = $("resourceURL").value.trim();
  const kind = $("resourceKind").value;
  const title = $("resourceTitle").value.trim();

  if (!title) return;

  if (file && enteredURL) {
    notify(t("sourceError"));
    return;
  }

  const resourceFile =
    file || (!enteredURL ? old?.file : null) || null;

  const url = enteredURL ? safeURL(enteredURL) : "";

  if (enteredURL && !url) {
    notify(t("invalidURL"));
    return;
  }

  if (!url && !resourceFile) {
    notify(t("sourceError"));
    return;
  }

  if (resourceFile) {
    if (resourceFile.size > 50 * 1024 * 1024) {
      notify(t("sizeError"));
      return;
    }

    const fileName = resourceFile.name || old?.fileName || "";

    const valid = kind === "videos"
      ? resourceFile.type.startsWith("video/")
      : (
          resourceFile.type === "application/pdf" ||
          /\.pdf$/i.test(fileName)
        );

    if (!valid) {
      notify(t("typeError"));
      return;
    }
  }

  const resource = {
    id:old?.id ||
      ("resource-" + Date.now() + "-" +
        Math.random().toString(36).slice(2)),
    kind,
    title,
    description:$("resourceDescription").value.trim(),
    url:url || "",
    file:resourceFile,
    fileName:resourceFile
      ? (file?.name || old?.fileName || "")
      : ""
  };

  const updated = {
    ...teacher,
    resources:old
      ? teacher.resources.map(item =>
          item.id === old.id ? resource : item
        )
      : [...teacher.resources,resource]
  };

  const submit = event.submitter ||
    $("resourceForm").querySelector('[type="submit"]');

  submit.disabled = true;

  try {
    await persistTeacher(updated);
    teachers.set(updated.id,updated);
    $("resourceDialog").close();

    if (currentTeacherId !== updated.id) openChannel(updated.id);

    currentTab = kind === "exams" ? "exercises" : kind;

    renderChannel();
    notify(t("saved"));
  } catch {
    notify(t("storageError"));
  } finally {
    submit.disabled = false;
  }
});

async function deleteResource(id) {
  const teacher = ownTeacher();

  if (
    !teacher ||
    !isOwner() ||
    !teacher.resources.some(item => item.id === id)
  ) return;

  if (!confirm(t("deleteConfirm"))) return;

  const updated = {
    ...teacher,
    resources:teacher.resources.filter(item => item.id !== id)
  };

  try {
    await persistTeacher(updated);
    teachers.set(updated.id,updated);
    renderChannel();
    notify(t("deleted"));
  } catch {
    notify(t("storageError"));
  }
}

/* MOBILE DRAWER */

function openMenu() {
  if (!session || !phoneQuery.matches) return;

  closeAccount();

  $("poleSidebar").inert = false;
  $("poleSidebar").classList.add("open");
  $("menuOverlay").hidden = false;
  $("menuButton").setAttribute("aria-expanded","true");

  document.body.classList.add("menu-open");
  $("closeMenuButton").focus();
}

function closeMenu(restoreFocus=true) {
  const wasOpen = $("poleSidebar").classList.contains("open");

  $("poleSidebar").classList.remove("open");
  $("menuOverlay").hidden = true;
  $("menuButton").setAttribute("aria-expanded","false");

  document.body.classList.remove("menu-open");

  if (wasOpen && restoreFocus) $("menuButton").focus();

  $("poleSidebar").inert = phoneQuery.matches;
}

phoneQuery.addEventListener("change",() => closeMenu(false));

document.addEventListener("keydown",event => {
  if (event.key === "Escape") {
    closeAccount();

    if ($("poleSidebar").classList.contains("open")) closeMenu();
  }

  if (
    event.key === "Tab" &&
    $("poleSidebar").classList.contains("open")
  ) {
    const items = [...$("poleSidebar").querySelectorAll("button")]
      .filter(node => node.getClientRects().length);

    const first = items[0];
    const last = items[items.length - 1];

    if (!first) return;

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});

/* CHANNEL TAB KEYBOARD NAVIGATION */

document.querySelector(".channel-tabs")
  .addEventListener("keydown",event => {
    const keys = ["pdfs","exercises","videos"];
    let index = keys.indexOf(currentTab);

    if (event.key === "ArrowRight") {
      index = (index + (language === "ar" ? 2 : 1)) % 3;
    } else if (event.key === "ArrowLeft") {
      index = (index + (language === "ar" ? 1 : 2)) % 3;
    } else if (event.key === "Home") {
      index = 0;
    } else if (event.key === "End") {
      index = 2;
    } else {
      return;
    }

    event.preventDefault();
    selectTab(keys[index]);
    $("tab-" + keys[index]).focus();
  });

document.querySelectorAll(".language-control").forEach(control => {
  control.addEventListener("change",event => {
    setLanguage(event.target.value);
  });
});

/* INITIALIZE */

setLanguage("fr");
closeMenu(false);
</script>
